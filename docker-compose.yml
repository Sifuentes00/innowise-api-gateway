services:
  postgres-auth:
    image: postgres:16-alpine
    container_name: postgres-auth
    environment:
      POSTGRES_DB: ${POSTGRES_AUTH_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_USER: ${APP_USER}
      APP_PASSWORD: ${APP_PASSWORD}
    ports:
      - "${POSTGRES_AUTH_PORT}"
    volumes:
      - postgres-auth-data:/var/lib/postgresql/data
      - ./scripts/init-auth-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - innowise-network

  postgres-user:
    image: postgres:16-alpine
    container_name: postgres-user
    environment:
      POSTGRES_DB: ${POSTGRES_USER_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_USER: ${APP_USER}
      APP_PASSWORD: ${APP_PASSWORD}
    ports:
      - "${POSTGRES_USER_PORT}"
    volumes:
      - postgres-user-data:/var/lib/postgresql/data
      - ./scripts/init-user-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - innowise-network

  postgres-order:
    image: postgres:16-alpine
    container_name: postgres-order
    environment:
      POSTGRES_DB: ${POSTGRES_ORDER_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_USER: ${APP_USER}
      APP_PASSWORD: ${APP_PASSWORD}
    ports:
      - "${POSTGRES_ORDER_PORT}"
    volumes:
      - postgres-order-data:/var/lib/postgresql/data
      - ./scripts/init-order-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    networks:
      - innowise-network

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "${REDIS_PORT}"
    networks:
      - innowise-network

  auth-service:
    build:
      context: ../innowise-authentification-service
      dockerfile: Dockerfile
    container_name: auth-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:${POSTGRES_AUTH_INTERNAL_PORT}/${POSTGRES_AUTH_DB}
      SPRING_DATASOURCE_USERNAME: ${APP_USER}
      SPRING_DATASOURCE_PASSWORD: ${APP_PASSWORD}
      SERVER_PORT: ${AUTH_SERVICE_PORT}
      LIQUIBASE_ENABLED: true
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION}
      KEY_PATH: ${KEY_PATH}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
    ports:
      - "${AUTH_SERVICE_PORT}"
    depends_on:
      - postgres-auth
    networks:
      - innowise-network

  user-service:
    build:
      context: ../innowise-user-service
      dockerfile: Dockerfile
    container_name: user-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-user:${POSTGRES_USER_INTERNAL_PORT}/${POSTGRES_USER_DB}
      SPRING_DATASOURCE_USERNAME: ${APP_USER}
      SPRING_DATASOURCE_PASSWORD: ${APP_PASSWORD}
      SERVER_PORT: ${USER_SERVICE_PORT}
      LIQUIBASE_ENABLED: true
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_PORT: ${REDIS_PORT}
    ports:
      - "${USER_SERVICE_PORT}"
    depends_on:
      - postgres-user
    networks:
      - innowise-network

  order-service:
    build:
      context: ../innowise-order-service
      dockerfile: Dockerfile
    container_name: order-service
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-order:${POSTGRES_ORDER_INTERNAL_PORT}/${POSTGRES_ORDER_DB}
      SPRING_DATASOURCE_USERNAME: ${APP_USER}
      SPRING_DATASOURCE_PASSWORD: ${APP_PASSWORD}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      SERVER_PORT: ${ORDER_SERVICE_PORT}
    ports:
      - "${ORDER_SERVICE_PORT}"
    depends_on:
      - postgres-order
      - user-service
    networks:
      - innowise-network

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-gateway
    environment:
      SPRING_PROFILES_ACTIVE: docker
      AUTH_SERVICE_URL: ${AUTH_SERVICE_URL}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      ORDER_SERVICE_URL: ${ORDER_SERVICE_URL}
      SERVER_PORT: ${API_GATEWAY_PORT}
    ports:
      - "${API_GATEWAY_PORT}"
    depends_on:
      - auth-service
      - user-service
      - order-service
    networks:
      - innowise-network

volumes:
  postgres-auth-data:
  postgres-user-data:
  postgres-order-data:

networks:
  innowise-network:
    driver: bridge
