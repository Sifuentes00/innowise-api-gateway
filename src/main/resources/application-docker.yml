server:
  port: 8083

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL}
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0

        - id: user-service
          uri: ${USER_SERVICE_URL}
          predicates:
            - Path=/api/users/**
          filters:
            - StripPrefix=0

        - id: payment-cards
          uri: ${USER_SERVICE_URL}
          predicates:
            - Path=/api/payment-cards/**
          filters:
            - StripPrefix=0

        - id: order-service
          uri: ${ORDER_SERVICE_URL}
          predicates:
            - Path=/api/orders/**
          filters:
            - StripPrefix=0

  resilience4j:
    circuitbreaker:
      configs:
        default:
          failure-rate-threshold: 50
          wait-duration-in-open-state: 10s
          sliding-window-size: 10
      instances:
        auth-service:
          base-config: default
        user-service:
          base-config: default
        order-service:
          base-config: default

auth-service:
  url: ${AUTH_SERVICE_URL}

user-service:
  url: ${USER_SERVICE_URL}

order-service:
  url: ${ORDER_SERVICE_URL}
